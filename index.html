<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세워도 돼?</title>
<meta name="description" content="지금 이 자리에 차를 세워도 되는지, 몇 시까지 되는지 공공데이터로 알려 주는 앱 (엘리스 AI 챌린지 PoC)">
<meta name="theme-color" content="#f4f5f2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 지도가 위, 판정이 아래. 색은 도로 표지에서 가져왔다: 금지 빨강, 허용 초록, 확인 노랑, 핀 파랑 */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --ink: #17191c;
  --muted: #646b73;
  --line: #e1e4e0;
  --stop: #d23a2f;
  --go: #1f8a4c;
  --caution: #e2a400;
  --caution-ink: #8a5a00;
  --pin: #1d5fd1;
  --unknown: #737b85;
  --font: "Wanted Sans Variable", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --surface: #1b1e21; --ink: #eef0ee; --muted: #9aa2ab; --line: #2c3136;
    --stop: #f0645a; --go: #4cc283; --caution: #f2c230; --caution-ink: #f2c230; --pin: #6b9cf0; --unknown: #8b95a1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --surface: #1b1e21; --ink: #eef0ee; --muted: #9aa2ab; --line: #2c3136;
  --stop: #f0645a; --go: #4cc283; --caution: #f2c230; --caution-ink: #f2c230; --pin: #6b9cf0; --unknown: #8b95a1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.55; letter-spacing: -0.01em;
  word-break: keep-all; overflow-wrap: break-word; font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, select, input { font: inherit; color: inherit; letter-spacing: inherit; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }

/* 머리 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; }
.brand { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
.mark { width: 26px; height: 26px; border-radius: 7px; background: var(--pin); color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 800; }
.clock { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.3; }
.clock b { display: block; color: var(--ink); font-size: 15px; font-weight: 700; }

/* 지도와 가운데 핀 */
.map-wrap { position: relative; height: clamp(260px, 44svh, 420px); background: var(--line); }
#map { position: absolute; inset: 0; }
.leaflet-container { font-family: var(--font); background: var(--line); }
.pin { position: absolute; left: 50%; top: 50%; width: 34px; height: 44px; transform: translate(-50%, -100%); pointer-events: none; z-index: 500; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
.pin-shadow { position: absolute; left: 50%; top: 50%; width: 10px; height: 4px; margin: -2px 0 0 -5px; border-radius: 50%; background: rgba(0,0,0,.35); z-index: 499; pointer-events: none; }
.map-hint { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 600; margin: 0 auto; width: fit-content; max-width: calc(100% - 24px);
  background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.15); text-align: center; }
.map-btn { position: absolute; right: 12px; bottom: 30px; z-index: 600; display: flex; align-items: center; gap: 6px;
  border: 0; border-radius: 12px; background: var(--surface); color: var(--ink); padding: 10px 12px; font-size: 14px; font-weight: 700; box-shadow: 0 2px 10px rgba(0,0,0,.18); cursor: pointer; min-height: 44px; }
.map-btn svg { width: 18px; height: 18px; color: var(--pin); }
.map-btn[aria-pressed="true"] { color: var(--pin); }
.legend { position: absolute; left: 12px; bottom: 30px; z-index: 600; display: flex; flex-direction: column; gap: 3px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); border-radius: 10px; padding: 7px 10px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 7px; }
.sw { width: 16px; height: 4px; border-radius: 2px; }
.sw.dot { width: 9px; height: 9px; border-radius: 50%; margin: 0 3.5px; }

/* 판정 시트 */
.sheet { position: relative; z-index: 700; margin-top: -18px; background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
  padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
.status { display: flex; align-items: center; gap: 10px; }
.sign { flex: none; min-width: 52px; padding: 5px 10px; border-radius: 8px; font-size: 15px; font-weight: 800; text-align: center; color: #fff; background: var(--unknown); }
.verdict[data-level="stop"] .sign { background: var(--stop); }
.verdict[data-level="go"] .sign { background: var(--go); }
.verdict[data-level="caution"] .sign { background: var(--caution); color: #1d1600; }
.place { min-width: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.headline { margin: 0; font-size: clamp(25px, 7vw, 30px); font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; text-wrap: balance; }
.sub { margin: -6px 0 0; font-size: 16px; font-weight: 600; color: var(--ink); }
.verdict[data-level="stop"] .sub { color: var(--stop); }
.verdict[data-level="go"] .sub { color: var(--go); }
.verdict[data-level="caution"] .sub { color: var(--caution-ink); }

.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 9px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; }
.facts dt { color: var(--muted); font-weight: 600; white-space: nowrap; }
.facts dt.stop { color: var(--stop); } .facts dt.caution { color: var(--caution-ink); }
.facts dd { margin: 0; }

.ask { background: color-mix(in srgb, var(--caution) 12%, var(--surface)); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.ask p { margin: 0; font-size: 14px; }
.ask .row { display: flex; gap: 8px; }
.ask .row .btn { flex: 1; min-height: 44px; padding: 10px 12px; font-size: 14px; }

.btn { border: 0; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--ink); color: var(--bg); min-height: 52px; }
.btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, .map-btn:focus-visible, .linkbtn:focus-visible, .spot:focus-visible, summary:focus-visible { outline: 3px solid var(--pin); outline-offset: 2px; }
.row2 { display: flex; gap: 8px; }
.row2 .btn:first-child { flex: 1; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--pin); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; align-self: flex-start; }

/* 타이머 */
.timer { margin: 0; background: var(--ink); color: var(--bg); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 700; }
.timer-label { font-size: 13px; opacity: .75; }
.elapsed { font-size: clamp(44px, 14vw, 60px); font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.remain { font-size: 16px; font-weight: 700; }
.bar { height: 6px; background: color-mix(in srgb, var(--bg) 20%, transparent); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0%; background: var(--caution); transition: width .6s linear; }
.timer[data-alert="true"] .bar > i { background: var(--stop); }
.timer[data-alert="true"] .remain { color: #ffb4ad; }
.timer .btn { background: var(--bg); color: var(--ink); }
.timer .btn.secondary { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.timer .note { margin: 0; font-size: 13px; opacity: .75; }

/* 아래 접는 칸 */
.more { padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 8px; }
details.panel { background: var(--surface); border-radius: 14px; }
details.panel > summary { cursor: pointer; padding: 14px 16px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-right: 4px; transition: transform .15s; }
details.panel[open] > summary::after { transform: rotate(-135deg); }
.panel-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.src { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.src b { font-size: 14px; }
.src .meta { color: var(--muted); font-size: 13px; }
.quote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--caution); background: color-mix(in srgb, var(--caution) 8%, transparent); font-size: 13px; border-radius: 0 8px 8px 0; }
pre.json { margin: 0; overflow-x: auto; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; line-height: 1.5; padding: 12px; border-radius: 10px; background: var(--bg); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; color: var(--pin); background: color-mix(in srgb, var(--pin) 12%, transparent); vertical-align: 1px; }
.spots { display: flex; flex-direction: column; gap: 6px; }
.spot { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
.spot b { display: block; font-size: 14px; }
.spot span { color: var(--muted); font-size: 13px; }
.spot[aria-pressed="true"] { border-color: var(--pin); box-shadow: inset 0 0 0 1px var(--pin); }
.demo-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.demo-row label { font-weight: 600; min-width: 4.5em; }
.demo-row input[type="range"] { flex: 1 1 160px; accent-color: var(--pin); }
.demo-row output { font-variant-numeric: tabular-nums; min-width: 5ch; font-weight: 700; }
.demo-row select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.demo-row .btn { min-height: 40px; padding: 8px 12px; font-size: 14px; }
.fine { font-size: 13px; color: var(--muted); margin: 0; }
.disclaimer { padding: 0 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14px; max-width: min(92vw, 480px); z-index: 2000; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
@media (prefers-reduced-motion: reduce) { .bar > i, details.panel > summary::after { transition: none; } }
@media (min-width: 561px) { .app { padding-top: 16px; } .map-wrap { border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; } .sheet { border-radius: var(--radius); } .timer { border-radius: var(--radius); margin-top: 8px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand"><span class="mark" aria-hidden="true">P</span>세워도 돼?</h1>
    <div class="clock num"><b id="clock-time">--:--</b><span id="clock-day"></span></div>
  </header>

  <section class="map-wrap" aria-label="주변 지도">
    <div id="map" role="application" aria-label="지도. 끌어서 핀을 차 위치에 맞추면 그 자리로 다시 판정합니다"></div>
    <div class="pin-shadow" aria-hidden="true"></div>
    <svg class="pin" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 43C17 43 32 27.6 32 17A15 15 0 0 0 2 17C2 27.6 17 43 17 43Z" fill="var(--pin)" stroke="#fff" stroke-width="2.5"/><text x="17" y="22.5" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="Wanted Sans Variable, sans-serif">P</text></svg>
    <p class="map-hint" id="map-hint">지도를 끌어 핀을 차 위치에 맞추세요</p>
    <div class="legend" aria-hidden="true">
      <span><i class="sw" style="background:var(--stop)"></i>지금 금지</span>
      <span><i class="sw" style="background:var(--go)"></i>지금 허용</span>
      <span><i class="sw dot" style="background:var(--caution)"></i>학교·어린이집</span>
    </div>
    <button class="map-btn" id="btn-locate" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      내 위치
    </button>
  </section>

  <section class="sheet verdict" id="verdict" data-level="unknown" aria-live="polite">
    <div class="status">
      <span class="sign" id="sign">확인 중</span>
      <span class="place" id="place">위치를 찾고 있어요</span>
    </div>
    <h2 class="headline" id="headline">잠시만요</h2>
    <p class="sub" id="sub" hidden></p>
    <div id="ask-slot"></div>
    <div class="row2">
      <button class="btn" id="btn-park" type="button" disabled>여기 세웠어요</button>
    </div>
    <dl class="facts" id="facts" hidden></dl>
    <button class="linkbtn" id="btn-why" type="button">무엇을 보고 판정했나요?</button>
  </section>

  <section class="timer" id="timer" data-alert="false" hidden aria-live="polite">
    <span class="timer-label" id="timer-label">세운 지</span>
    <div class="elapsed" id="timer-elapsed">00:00</div>
    <span class="remain" id="timer-remain"></span>
    <div class="bar"><i id="timer-bar"></i></div>
    <p class="note" id="timer-note"></p>
    <div class="row2">
      <button class="btn" id="btn-leave" type="button">차 뺐어요</button>
      <button class="btn secondary" id="btn-notify" type="button">알림 받기</button>
    </div>
  </section>

  <div class="more">
    <details class="panel" id="why">
      <summary>판정 근거와 출처</summary>
      <div class="panel-body" id="why-body"><p class="fine">위치를 정하면 여기에 쓰인 데이터와 공지가 나와요.</p></div>
    </details>

    <details class="panel" id="ai">
      <summary>구청 공지를 규칙으로 바꾼 과정</summary>
      <div class="panel-body" id="ai-body"></div>
    </details>

    <details class="panel" id="demo">
      <summary>시연 도구</summary>
      <div class="panel-body">
        <div class="spots" role="group" aria-label="시연 지점">
          <button class="spot demo-spot" type="button" data-spot="0" aria-pressed="false"><b>독산로 우체국 앞</b><span>시간대별 금지 구간</span></button>
          <button class="spot demo-spot" type="button" data-spot="1" aria-pressed="false"><b>가산초등학교 옆 길</b><span>어린이보호구역 근처</span></button>
          <button class="spot demo-spot" type="button" data-spot="2" aria-pressed="false"><b>금하로1길 주택가</b><span>지정 금지구간 밖</span></button>
        </div>
        <div class="demo-row">
          <label for="time-shift">시각</label>
          <input type="range" id="time-shift" min="0" max="1439" step="5">
          <output id="time-shift-out" for="time-shift">지금</output>
        </div>
        <div class="demo-row">
          <label for="day-type">요일</label>
          <select id="day-type">
            <option value="auto">오늘 날짜대로</option>
            <option value="weekday">평일</option>
            <option value="sat">토요일</option>
            <option value="hol">일요일·공휴일</option>
          </select>
          <button class="btn secondary" id="time-reset" type="button">지금으로</button>
        </div>
        <div class="demo-row">
          <button class="btn secondary" id="fast-timer" type="button" aria-pressed="false">타이머 60배속</button>
          <span class="fine">1분이 1초로 흘러요. 켠 뒤에 세운 기록부터 적용돼요.</span>
        </div>
      </div>
    </details>

    <p class="fine disclaimer">안내일 뿐 법적 보증은 아니에요. 현장의 표지와 노면 표시가 우선이고, 이동식·현장 단속은 언제든 있을 수 있어요.</p>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="rules.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
